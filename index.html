<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVTA Live Route Monitor</title>
    <style>
        /* Modern, ultra-compact high-visibility styling optimized for TV dashboards */
        html, body {
            height: 100%;
            overflow: hidden; /* Strict lock to prevent manual window scrolling */
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 1vw;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .page-indicator {
            font-size: 1.2rem;
            background: #2a2a2a;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            color: #4caf50;
        }

        .update-timer {
            font-size: 1rem;
            color: #888;
            text-transform: none;
            letter-spacing: 0;
        }

        /* Tighter grid layout container that handles pagination heights natively */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 0.8vw;
            flex-grow: 1;
            align-content: start;
        }

        /* Ultra-shorter card footprints to fit maximum data onto a single view */
        .route-card {
            background-color: #1e1e1e;
            border-radius: 6px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 85px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            border-left: 8px solid #4caf50; /* Default Green for Active/Normal Service */
            box-sizing: border-box;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .route-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.3rem;
        }

        .route-number {
            font-size: 2.8rem;
            font-weight: 900;
            margin: 0;
            background: #333;
            padding: 1px 12px;
            border-radius: 4px;
            letter-spacing: -1px;
        }

        .status-badge {
            font-size: 1.1rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .alert-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
        }

        .alert-item {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 0.4rem;
        }

        .alert-container .alert-item:first-child {
            border-top: none;
            padding-top: 0;
        }

        .alert-title {
            font-weight: bold;
            color: #ff9800;
            font-size: 0.95rem;
            text-transform: uppercase;
            margin-bottom: 0.1rem;
        }

        .alert-danger .alert-title {
            color: #f44336;
        }

        .status-details {
            font-size: 1.15rem;
            color: #d4d4d4;
            line-height: 1.3;
            font-weight: 400;
        }

        /* Dynamic Style Modifiers */
        .status-normal { background-color: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .route-card.alert-warning { border-left-color: #ff9800; }
        .status-warning { background-color: rgba(255, 152, 0, 0.2); color: #ff9800; }
        .route-card.alert-danger { border-left-color: #f44336; background-color: #2c1a1a; }
        .status-alert { background-color: rgba(244, 67, 54, 0.2); color: #f44336; }

        /* Responsive Layout Settings */
        @media (min-width: 1600px) { .dashboard-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 2200px) { .dashboard-grid { grid-template-columns: repeat(5, 1fr); } }
        @media (max-width: 1100px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .route-card { min-height: auto; padding: 1rem; }
            .route-number { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <h1>
        PVTA Live Monitor
        <div class="header-right">
            <span class="page-indicator" id="page-text">Page 1/1</span>
            <span class="update-timer" id="timer-text">Loading tracker...</span>
        </div>
    </h1>
    
    <div class="dashboard-grid" id="status-board"></div>

    <script>
        // --- STEP 1: CONFIGURATION ---
        const API_KEY = "a0cc036b28c816057ba1ea9fd53f58ad";

        const VEHICLES_URL = "https://api.goswift.ly/real-time/pioneer-valley-pvta/vehicles?format=json"; 
        const ALERTS_URL = "https://api.goswift.ly/real-time/pioneer-valley-pvta/gtfs-rt-alerts/v2?format=json";

        const PVTA_ROUTE_ORDER = [
            "G1", "G2", "G3", "B4", "G5", "B6", "B7", "R10", "P11", "B12", "R14", "B17", "G19", 
            "P20", "P21", "P21E", "R22", "B23", "R24", "R29", "30", "31", "33", "34", "35", "38", 
            "38NS", "R41", "R42", "B43", "B43E", "R44", "45", "46", "G47", "B48", "B49", "G73E", "B79", 
            "X90", "X92", "X94", "NE", "PG", "PS", "WS", "T1", "T2", "T3", "T4", "T5", "T6", "T20", "T21",
				"T23", "T24", "T92", "UMG"
        ];

        // Pagination State Variables
        let globalProcessedCards = [];
        let currentPage = 0;
        const CARDS_PER_PAGE = 12; 
        let rotationInterval = null;

        // --- STEP 2: FETCH LIVE DATA ---
        async function fetchTransitTracker() {
            document.getElementById('timer-text').innerText = "Scanning fleet...";
            
            try {
                const fetchOptions = {
                    method: 'GET',
                    headers: {
                        'Authorization': API_KEY,
                        'Accept': 'application/json'
                    }
                };

                const [vehiclesResponse, alertsResponse] = await Promise.all([
                    fetch(VEHICLES_URL, fetchOptions),
                    fetch(ALERTS_URL, fetchOptions)
                ]);

                const vehiclesText = await vehiclesResponse.text();
                const alertsText = await alertsResponse.text();

                const vehiclesData = JSON.parse(vehiclesText);
                const serviceAlertsData = JSON.parse(alertsText);

                // Prepare and sort dataset
                compileRouteCards(vehiclesData, serviceAlertsData);
                
                // Render Page 0 immediately upon database sync execution
                displayCurrentPage();
                
                // Reinitialize smooth loop cycling timers safely
                startPageRotation();

                const now = new Date();
                document.getElementById('timer-text').innerText = `Live | Updated: ${now.toLocaleTimeString()}`;

            } catch (error) {
                console.error("Detailed connection error:", error);
                document.getElementById('timer-text').innerText = "Offline. Reconnecting...";
            }
        }

        // --- STEP 3: DATA STRUCTURING ENGINE ---
        function compileRouteCards(vehiclesData, alertsData) {
            globalProcessedCards = []; // Clear the master layout matrix

            const liveVehicles = vehiclesData?.data?.vehicles || vehiclesData?.vehicles || [];
            const alerts = Array.isArray(alertsData) ? alertsData : [];

            // FIXED: If there are no vehicles active right now, don't crash. 
            // We let it skip to the rendering step below so it displays an elegant offline/empty screen.
            if (liveVehicles.length > 0) {
                const activeRoutesMap = new Map();

                // Group vehicles into single route entities
                liveVehicles.forEach(vehicle => {
                    if (!vehicle.routeShortName) return; 
                    let sName = vehicle.routeShortName.trim();
                    
                    if (!activeRoutesMap.has(sName)) {
                        activeRoutesMap.set(sName, {
                            id: vehicle.routeId,
                            shortName: sName
                        });
                    }
                });

                // Apply custom tracking sequence constraints
                const uniqueRoutes = Array.from(activeRoutesMap.values()).sort((a, b) => {
                    let indexA = PVTA_ROUTE_ORDER.indexOf(a.shortName);
                    let indexB = PVTA_ROUTE_ORDER.indexOf(b.shortName);

                    if (indexA === -1) indexA = 999;
                    if (indexB === -1) indexB = 999;

                    if (indexA !== indexB) return indexA - indexB;
                    return a.shortName.localeCompare(b.shortName, undefined, {numeric: true, sensitivity: 'base'});
                });

                // Convert processed components into static layout strings
                uniqueRoutes.forEach(route => {
                    const matchingAlerts = alerts.filter(alertObj => 
                        alertObj?.informedEntities?.some(ie => String(ie.routeId) === String(route.shortName) || String(ie.routeId) === String(route.id))
                    );

                    let cardClass = '';
                    let statusClass = 'status-normal';
                    let statusText = 'Active';
                    let innerAlertsHTML = '';

                    if (matchingAlerts.length > 0) {
                        const hasSevereAlert = matchingAlerts.some(a => a.effect === 'NO_SERVICE' || a.effect === 'DETOUR');
                        
                        if (hasSevereAlert) {
                            cardClass = 'alert-danger';
                            statusClass = 'status-alert';
                            statusText = 'Alert';
                        } else {
                            cardClass = 'alert-warning';
                            statusClass = 'status-warning';
                            statusText = 'Modified';
                        }

                        innerAlertsHTML = '<div class="alert-container">';
                        matchingAlerts.forEach(alert => {
                            const effectLabel = (alert.effect || 'ALERT').replace('_', ' ');
                            const contentText = alert.descriptionText || alert.headerText || "Service modification active.";
                            
                            innerAlertsHTML += `
                                <div class="alert-item">
                                    <div class="alert-title">${effectLabel}</div>
                                    <div class="status-details">${contentText}</div>
                                </div>
                            `;
                        });
                        innerAlertsHTML += '</div>';

                    } else {
                        innerAlertsHTML = `
                            <div class="status-details" style="color: #666; font-style: italic;">
                                Normal Operations
                            </div>
                        `;
                    }

                    const finalCardMarkup = `
                        <div class="route-card ${cardClass}">
                            <div class="route-header">
                                <span class="route-number">${route.shortName}</span>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            ${innerAlertsHTML}
                        </div>
                    `;
                    
                    globalProcessedCards.push(finalCardMarkup);
                });
            }
        }

        // --- STEP 4: AUTOMATED PAGINATION CONTROLLER ---
        function displayCurrentPage() {
            const board = document.getElementById('status-board');
            
            if (globalProcessedCards.length === 0) {
                board.innerHTML = `<div style="font-size:1.5rem; padding:2rem; color:#888; text-align:center; width:100%;">No active buses tracking on routes at this time.</div>`;
                document.getElementById('page-text').innerText = "Page 1/1";
                return;
            }

            const totalPages = Math.ceil(globalProcessedCards.length / CARDS_PER_PAGE);
            
            // Safety layout check wrap
            if (currentPage >= totalPages) currentPage = 0;

            document.getElementById('page-text').innerText = `Page ${currentPage + 1}/${totalPages}`;

            const startIdx = currentPage * CARDS_PER_PAGE;
            const endIdx = startIdx + CARDS_PER_PAGE;
            const pageSlice = globalProcessedCards.slice(startIdx, endIdx);

            board.innerHTML = pageSlice.join('');
        }

        function startPageRotation() {
            if (rotationInterval) clearInterval(rotationInterval);

            rotationInterval = setInterval(() => {
                const totalPages = Math.ceil(globalProcessedCards.length / CARDS_PER_PAGE);
                
                if (totalPages > 1) {
                    currentPage = (currentPage + 1) % totalPages; 
                    displayCurrentPage();
                }
            }, 20000); 
        }

        // --- STEP 5: INSTANTIATE ENGINE PROGRAM LOOPS ---
        fetchTransitTracker();
        setInterval(fetchTransitTracker, 60000); 
    </script>
</body>
</html>
